# One deploy, whichever the environment: write that environment's settings on
# its App Service app, then have the app run the given image. Staging and
# production both deploy through here, so production is deployed exactly the
# way staging was, only with its own app and its own secrets.
#
# The caller is already logged in to Azure (azure/login), as the GitHub
# Environment it runs in.
name: Deploy to App Service
description: Run one image on one environment's App Service app, with that environment's settings.

inputs:
  image:
    description: The image to run, tagged with the commit it was built from.
    required: true
  resource-group:
    description: The resource group holding the app.
    required: true
  app-name:
    description: The environment's App Service app.
    required: true
  dev-login-key:
    description: The environment's own DEV_LOGIN_KEY.
    required: true
  secret-key:
    description: The environment's own SECRET_KEY.
    required: true
  mistral-api-key:
    description: The environment's own MISTRAL_API_KEY.
    required: true
  default-provider-api-type:
    description: DEFAULT_PROVIDER_API_TYPE.
    required: true
  default-provider-base-url:
    description: DEFAULT_PROVIDER_BASE_URL.
    required: true
  default-provider-model:
    description: DEFAULT_PROVIDER_MODEL.
    required: true
  default-provider-key-env:
    description: DEFAULT_PROVIDER_KEY_ENV.
    required: true

outputs:
  url:
    description: >
      The app's own URL, https://<its actual hostname>. App Service gives
      every app a random hostname suffix on this subscription, so this is
      read from Azure (az webapp show), never built from app-name.
    value: ${{ steps.hostname.outputs.url }}

runs:
  using: composite
  steps:
    # App Service app names on this subscription do not get the hostname
    # <app-name>.azurewebsites.net: Azure appends a random suffix instead
    # (shared, crowded subscription). So every URL this action and its caller
    # need is read here, once, rather than ever built from app-name.
    - name: Read this app's own hostname
      id: hostname
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
      run: |
        host=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query defaultHostName --output tsv)
        echo "host=$host" >> "$GITHUB_OUTPUT"
        echo "url=https://$host" >> "$GITHUB_OUTPUT"

    # Written at every deploy, so that the GitHub Environment stays the one
    # place a setting is changed. --output none: the command would otherwise
    # print every setting back, secrets included.
    #
    # - WEBSITES_PORT: uvicorn listens on 8000 (oceens.main:run), not on the
    #   80 App Service expects by default.
    # - RUN_SUMMARIES_DAEMON=1: this image's only process is `oceens`; without
    #   this, oceens.main's lifespan never starts the summaries daemon
    #   alongside it, and requested summaries stay pending with no error.
    # - AUTH_MODE=dev: both environments hold generated data and no real
    #   users, so they sign in through the dev sign-in, guarded by the
    #   environment's own DEV_LOGIN_KEY, with its own SECRET_KEY signing the
    #   session cookie.
    - name: Write this environment's settings
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
        DEV_LOGIN_KEY: ${{ inputs.dev-login-key }}
        SECRET_KEY: ${{ inputs.secret-key }}
        MISTRAL_API_KEY: ${{ inputs.mistral-api-key }}
        DEFAULT_PROVIDER_API_TYPE: ${{ inputs.default-provider-api-type }}
        DEFAULT_PROVIDER_BASE_URL: ${{ inputs.default-provider-base-url }}
        DEFAULT_PROVIDER_MODEL: ${{ inputs.default-provider-model }}
        DEFAULT_PROVIDER_KEY_ENV: ${{ inputs.default-provider-key-env }}
      run: |
        az webapp config appsettings set \
          --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
          --settings \
            WEBSITES_PORT=8000 \
            AUTH_MODE=dev \
            RUN_SUMMARIES_DAEMON=1 \
            "DEV_LOGIN_KEY=$DEV_LOGIN_KEY" \
            "SECRET_KEY=$SECRET_KEY" \
            "MISTRAL_API_KEY=$MISTRAL_API_KEY" \
            "DEFAULT_PROVIDER_API_TYPE=$DEFAULT_PROVIDER_API_TYPE" \
            "DEFAULT_PROVIDER_BASE_URL=$DEFAULT_PROVIDER_BASE_URL" \
            "DEFAULT_PROVIDER_MODEL=$DEFAULT_PROVIDER_MODEL" \
            "DEFAULT_PROVIDER_KEY_ENV=$DEFAULT_PROVIDER_KEY_ENV"

    # The image is public on GHCR, so the app pulls it without credentials.
    - name: Run the image
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
        IMAGE: ${{ inputs.image }}
      run: |
        az webapp config container set \
          --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
          --container-image-name "$IMAGE"
        running=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query linuxFxVersion --output tsv)
        if [ "$running" != "DOCKER|$IMAGE" ]; then
          echo "$APP_NAME is set to $running, not $IMAGE" >&2
          exit 1
        fi
        echo "$APP_NAME now runs $IMAGE"

    # The app restarts on the new image, but App Service keeps serving the
    # previous container until the new one has started, or failed to. A 200
    # alone may come from the previous image, so wait until the image just set
    # answers: the app sends the commit it was built from in its X-Revision
    # header, and the image's tag is that commit. A container that does not
    # start then fails this run, even while the previous one still answers.
    #
    # The time limit mirrors the Worked Example's measurement
    # (EPF-MDE/MATHutrice#100): a new image took up to 350 s to answer on a
    # shared B1 plan. The limit is twice that, 700 s.
    - name: Wait until the new image answers
      shell: bash
      env:
        URL: ${{ steps.hostname.outputs.url }}
        IMAGE: ${{ inputs.image }}
      run: |
        url="$URL/dev/login"
        revision="${IMAGE##*:}"
        limit=700
        start=$(date +%s)
        attempt=0
        while true; do
          attempt=$((attempt + 1))
          answer=$(curl -s -o /dev/null -w '%{http_code} %header{x-revision}' --max-time 30 "$url" || true)
          elapsed=$(( $(date +%s) - start ))
          if [ "$answer" = "200 $revision" ]; then
            echo "$url answers 200 from $revision, ${elapsed} s after the image was set"
            exit 0
          fi
          echo "Attempt $attempt, ${elapsed} s: $url answered ${answer:-nothing}, waiting for 200 $revision"
          if [ "$elapsed" -ge "$limit" ]; then
            echo "$url did not answer 200 from $revision within $limit s" >&2
            exit 1
          fi
          sleep 15
        done
